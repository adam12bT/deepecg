name: Deploy the best SleepOps model

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      trial_candidate:
        description: Optional candidate ID for a trial deployment inside the CI runner
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: ${{ github.ref == format('refs/heads/{0}', vars.SLEEPOPS_DEPLOY_BRANCH || 'main') && vars.SLEEPOPS_HF_SPACE != '' && vars.SLEEPOPS_HF_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      request: ${{ steps.plan.outputs.request }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface_hub==1.28.0
      - name: Read the private deployment queue
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          SLEEPOPS_HF_BUCKET: ${{ vars.SLEEPOPS_HF_BUCKET }}
          TRIAL_CANDIDATE: ${{ inputs.trial_candidate }}
        run: python -m deploy.huggingface.promotion plan --trial-candidate "$TRIAL_CANDIDATE"

  deploy:
    name: Verify the candidate and deploy when requested
    needs: plan
    if: needs.plan.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: sleepops-production-${{ vars.SLEEPOPS_HF_SPACE }}
      cancel-in-progress: false
    env:
      SLEEPOPS_HF_SPACE: ${{ vars.SLEEPOPS_HF_SPACE }}
      SLEEPOPS_HF_BUCKET: ${{ vars.SLEEPOPS_HF_BUCKET }}
      PROMOTION_CANDIDATE: ${{ needs.plan.outputs.candidate }}
      PROMOTION_REQUEST: ${{ needs.plan.outputs.request }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/huggingface/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install '.[api,test]' -r deploy/huggingface/requirements.txt
      - name: Restore and validate the candidate and its DVC dataset
        id: prepare
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
        run: python -m deploy.huggingface.promotion prepare
      - if: steps.prepare.outputs.ready == 'true'
        run: python -m sleepops validate --lock configs/dataset.json
      - name: Smoke-test the candidate in the Space image
        if: steps.prepare.outputs.ready == 'true'
        run: |
          docker build --target space --tag sleepops-promotion .
          docker run --detach --name sleepops-promotion --publish 127.0.0.1:7860:7860 sleepops-promotion
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:7860/api/health/ready
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:7860/ | grep -q 'content="sleepops-react"'
          python deploy/smoke_http.py --url http://127.0.0.1:7860/api
      - name: Publish, verify the live Space, and pin the release in Git
        if: steps.prepare.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
        run: python -m deploy.huggingface.promotion publish
      - name: Save the outcome in SleepOps Admin
        if: always() && steps.prepare.outputs.claimed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: python -m deploy.huggingface.promotion finish --job-result "$JOB_RESULT"
      - if: failure()
        run: if docker container inspect sleepops-promotion >/dev/null 2>&1; then docker logs sleepops-promotion; fi
