name: SleepOps CI/CD

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install '.[api,test]'
      - run: python -m pytest -m 'not dataset and not serving_assets'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build && npm run build:admin
        working-directory: frontend
      - run: docker compose config --quiet

  deploy:
    name: Deploy app, model, and dataset to Hugging Face
    if: ${{ github.ref == format('refs/heads/{0}', vars.SLEEPOPS_DEPLOY_BRANCH || 'sleepops') && github.event_name != 'pull_request' && vars.SLEEPOPS_HF_SPACE != '' && vars.SLEEPOPS_HF_BUCKET != '' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: sleepops-production-${{ vars.SLEEPOPS_HF_SPACE }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/huggingface/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install '.[api,test]' -r deploy/huggingface/requirements.txt
      - name: Restore both private DVC objects and assemble the serving files
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          SLEEPOPS_HF_BUCKET: ${{ vars.SLEEPOPS_HF_BUCKET }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::Set the HF_DEPLOY_TOKEN repository secret before deploying.'
            exit 1
          fi
          python deploy/huggingface/release.py pull-data --bucket "$SLEEPOPS_HF_BUCKET"
          python deploy/huggingface/release.py pull-model --bucket "$SLEEPOPS_HF_BUCKET"
          python deploy/huggingface/release.py pull-stage-model --bucket "$SLEEPOPS_HF_BUCKET"
          python -m deploy.huggingface.release hydrate-serving
      - run: python -m sleepops validate --lock configs/dataset.json
      - run: python -m sleepops status
      - run: python -m pytest
      - run: docker compose up --build --wait --wait-timeout 120
      - run: python deploy/smoke_http.py
      - run: curl --fail --silent http://127.0.0.1:8501/ | grep -q 'content="sleepops-react"'
      - run: curl --fail --retry 5 --retry-connrefused http://127.0.0.1:9090/-/ready
      - name: Build and smoke-test the Hugging Face Space image
        run: |
          docker build --target space --tag sleepops-space-ci .
          docker run --detach --name sleepops-space-ci --publish 127.0.0.1:7860:7860 sleepops-space-ci
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:7860/api/health/ready
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:7860/ | grep -q 'content="sleepops-react"'
          python deploy/smoke_http.py --url http://127.0.0.1:7860/api
      - name: Build and smoke-test the Hugging Face Admin image
        env:
          SLEEPOPS_HF_BUCKET: adamnouassida5/sleepops-eeg-data
        run: |
          python -m deploy.training_space.publish stage "$RUNNER_TEMP/admin-space" --sdk docker
          docker build --file "$RUNNER_TEMP/admin-space/Dockerfile" --tag sleepops-admin-ci "$RUNNER_TEMP/admin-space"
          docker run --detach --name sleepops-admin-ci --publish 127.0.0.1:7861:7860 --env SLEEPOPS_HF_BUCKET="$SLEEPOPS_HF_BUCKET" sleepops-admin-ci
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:7861/api/admin/training | grep -q '"phase":"idle"'
          curl --fail --silent --show-error http://127.0.0.1:7861/ | grep -q 'SleepOps Admin'
      - name: Publish the DVC objects and verify the live SleepOps build
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          SLEEPOPS_HF_SPACE: ${{ vars.SLEEPOPS_HF_SPACE }}
          SLEEPOPS_HF_BUCKET: ${{ vars.SLEEPOPS_HF_BUCKET }}
          SLEEPOPS_TRAINING_SPACE: ${{ vars.SLEEPOPS_TRAINING_SPACE || 'adamnouassida5/the_dot_camp5' }}
        run: |
          latest=$(git ls-remote --exit-code origin "$GITHUB_REF")
          if [ "${latest%%$'\t'*}" != "$GITHUB_SHA" ]; then
            echo "A newer commit owns the production deployment."
            exit 0
          fi
          python deploy/huggingface/release.py deploy --space "$SLEEPOPS_HF_SPACE" --bucket "$SLEEPOPS_HF_BUCKET" --reuse-existing --allow-public --wait-seconds 900
      - name: Publish the React Admin UI to its private Space
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          SLEEPOPS_HF_SPACE: ${{ vars.SLEEPOPS_HF_SPACE }}
          SLEEPOPS_HF_BUCKET: ${{ vars.SLEEPOPS_HF_BUCKET }}
          SLEEPOPS_TRAINING_SPACE: ${{ vars.SLEEPOPS_TRAINING_SPACE || 'adamnouassida5/the_dot_camp5' }}
        run: python -m deploy.training_space.publish reuse-docker --space "$SLEEPOPS_TRAINING_SPACE" --bucket "$SLEEPOPS_HF_BUCKET" --prediction-space "$SLEEPOPS_HF_SPACE"
      - if: failure()
        run: |
          docker compose logs --no-color
          if docker container inspect sleepops-space-ci >/dev/null 2>&1; then
            docker logs sleepops-space-ci
          fi
          if docker container inspect sleepops-admin-ci >/dev/null 2>&1; then
            docker logs sleepops-admin-ci
          fi
      - if: always()
        run: |
          if docker container inspect sleepops-space-ci >/dev/null 2>&1; then
            docker rm -f sleepops-space-ci
          fi
          if docker container inspect sleepops-admin-ci >/dev/null 2>&1; then
            docker rm -f sleepops-admin-ci
          fi
          docker compose down

