name: SleepOps CI/CD

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install '.[api,test]'
      - run: python -m pytest -m 'not dataset and not serving_assets'
      - run: docker compose config --quiet

  deploy:
    name: Deploy app, model, and dataset to Hugging Face
    if: ${{ github.ref == format('refs/heads/{0}', vars.SLEEPOPS_DEPLOY_BRANCH || 'main') && github.event_name != 'pull_request' && vars.SLEEPOPS_HF_SPACE != '' && vars.SLEEPOPS_HF_BUCKET != '' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: sleepops-production-${{ vars.SLEEPOPS_HF_SPACE }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/huggingface/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install '.[api,test]' -r deploy/huggingface/requirements.txt
      - name: Restore both private DVC objects and assemble the serving files
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          SLEEPOPS_HF_BUCKET: ${{ vars.SLEEPOPS_HF_BUCKET }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::Set the HF_DEPLOY_TOKEN repository secret before deploying.'
            exit 1
          fi
          python deploy/huggingface/release.py pull-data --bucket "$SLEEPOPS_HF_BUCKET"
          python deploy/huggingface/release.py pull-model --bucket "$SLEEPOPS_HF_BUCKET"
          python -m deploy.huggingface.release hydrate-serving
      - run: python -m sleepops validate --lock configs/dataset.json
      - run: python -m sleepops status
      - run: python -m pytest
      - run: docker compose up --build --wait --wait-timeout 120
      - run: python deploy/smoke_http.py
      - run: curl --fail --retry 5 --retry-connrefused http://127.0.0.1:9090/-/ready
      - name: Build and smoke-test the Hugging Face Space image
        run: |
          docker build --target space --tag sleepops-space-ci .
          docker run --detach --name sleepops-space-ci --publish 127.0.0.1:7860:7860 sleepops-space-ci
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:7860/api/health/ready
          curl --fail http://127.0.0.1:7860/_stcore/health
          python deploy/smoke_http.py --url http://127.0.0.1:7860/api
      - name: Publish the DVC objects and verify the live SleepOps build
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          SLEEPOPS_HF_SPACE: ${{ vars.SLEEPOPS_HF_SPACE }}
          SLEEPOPS_HF_BUCKET: ${{ vars.SLEEPOPS_HF_BUCKET }}
        run: python deploy/huggingface/release.py deploy --space "$SLEEPOPS_HF_SPACE" --bucket "$SLEEPOPS_HF_BUCKET" --wait-seconds 900
      - if: failure()
        run: |
          docker compose logs --no-color
          if docker container inspect sleepops-space-ci >/dev/null 2>&1; then
            docker logs sleepops-space-ci
          fi
      - if: always()
        run: |
          if docker container inspect sleepops-space-ci >/dev/null 2>&1; then
            docker rm -f sleepops-space-ci
          fi
          docker compose down

