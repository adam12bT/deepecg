services:
  api:
    build:
      context: .
      target: api
    environment:
      SLEEPOPS_REGISTRY: /app/registry
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./registry:/app/registry:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  demo:
    build:
      context: .
      target: demo
    ports:
      - "127.0.0.1:${DEMO_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8501/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

volumes:
  prometheus-data:
