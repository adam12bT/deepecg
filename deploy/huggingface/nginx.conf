worker_processes 1;
pid /tmp/sleepops-nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    access_log off;
    client_body_temp_path /tmp/sleepops-client-body;
    proxy_temp_path /tmp/sleepops-proxy;
    fastcgi_temp_path /tmp/sleepops-fastcgi;
    uwsgi_temp_path /tmp/sleepops-uwsgi;
    scgi_temp_path /tmp/sleepops-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 7860;
        client_max_body_size 4m;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
